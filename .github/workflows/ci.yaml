name: CI Pipeline

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "GAPGPTMASKTOKEN5i4i72v5izX0X"

      - name: Run Biome Check
        run: npx @biomejs/biome ci .

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Test Build
        run: npm run build
        env:
          DATABASE_URL: "GAPGPTMASKTOKEN5i4i72v5izX1X"
